<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stephen's Daily Boost</title>
<meta name="app-version" content="3.1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23003F87'/><circle cx='50' cy='50' r='28' fill='%23FFD166'/></svg>">
<style>
  /* ─────────────────────────────────────────────────────────────
     COLORS — swap these to re-theme the whole page
     ───────────────────────────────────────────────────────────── */
  :root{
    --blue:#003F87;        /* Johnstone blue */
    --red:#E4232F;         /* One Degree red */
    --sun:#FFD166;         /* skin / highlight */
    --sky:#FFD9A8;         /* background (fall edition) */
    --sky2:#FFB36B;
    --turf:#2E7D32;
    --turf2:#276B2B;
    --leaf1:#E4572E; --leaf2:#F3A712; --leaf3:#A4451B;
    --floor:#002C5F;       /* stage floor */
    --ink:#0F2A4A;
    --paper:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;overflow:hidden;
  }
  header{
    width:100%;max-width:720px;padding:28px 20px 0;text-align:center;
  }
  header h1{
    margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:-.5px;color:var(--blue);
    line-height:1.05;
  }
  header p{margin:6px 0 0;font-size:15px;opacity:.75}
  .pennant{display:inline-block;margin-top:10px;padding:5px 14px;background:var(--blue);color:#fff;font-weight:800;font-size:12px;letter-spacing:2px;border-radius:4px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}

  /* stage */
  .stage{
    position:relative;width:100%;max-width:720px;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    min-height:420px;
  }
  /* the stage is now a fairway: mowing stripes, no lines */
  .floor{
    position:absolute;left:0;right:0;bottom:0;height:22%;
    background:repeating-linear-gradient(100deg,var(--turf) 0 54px,var(--turf2) 54px 108px);
    border-top:4px solid #BFE3A6;
    border-radius:50% 50% 0 0 / 40px 40px 0 0;
    overflow:hidden;
  }
  /* drifting fall leaves */
  .leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .leaves svg{position:absolute;top:-40px;width:22px;height:22px;animation:leaf linear infinite;opacity:.9}
  @keyframes leaf{
    0%{transform:translate(0,0) rotate(0deg)}
    25%{transform:translate(30px,25vh) rotate(90deg)}
    50%{transform:translate(-20px,50vh) rotate(200deg)}
    75%{transform:translate(25px,75vh) rotate(300deg)}
    100%{transform:translate(-10px,105vh) rotate(420deg)}
  }
  .stage,header,.controls{position:relative;z-index:1}
  .bubble{
    position:relative;z-index:2;
    background:var(--paper);border:3px solid var(--ink);border-radius:18px;
    padding:14px 20px;max-width:88%;font-size:clamp(17px,3.2vw,22px);font-weight:700;
    text-align:center;margin-bottom:18px;
    box-shadow:6px 6px 0 var(--ink);
    animation:pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
    border:8px solid transparent;border-top:10px solid var(--ink);
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  .buddy{position:relative;z-index:1;width:min(60vw,260px);margin-bottom:10%}
  .buddy svg{width:100%;height:auto;overflow:visible;display:block}
  .buddy .part{transform-box:view-box}

  /* controls */
  .controls{
    position:relative;z-index:3;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
    padding:0 16px 28px;width:100%;max-width:720px;
  }
  button{
    font:inherit;font-weight:700;font-size:16px;cursor:pointer;
    padding:14px 22px;border-radius:999px;border:3px solid var(--ink);
    background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s,box-shadow .08s;
  }
  button.alt{background:var(--paper);color:var(--ink)}
  button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
  button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

  /* ─────────────────────────────────────────────────────────────
     MOVES — golf edition. Parts: #body #head #armL #armR #legL #legR
     plus #club (pivots at the hands) and #gball (the golf ball).
     ───────────────────────────────────────────────────────────── */

  /* Golf stance shared by every move: hands together in front */
  .stage #armL{transform:rotate(-22deg)}
  .stage #armR{transform:rotate(22deg)}

  /* Drive: waggle, backswing, rip it, watch it go */
  .drive #body{animation:dr-body 2.6s ease-in-out infinite}
  .drive #head{animation:dr-head 2.6s ease-in-out infinite}
  .drive #armL{animation:dr-armL 2.6s ease-in-out infinite}
  .drive #armR{animation:dr-armR 2.6s ease-in-out infinite}
  .drive #club{animation:dr-club 2.6s ease-in-out infinite}
  .drive #gball{animation:dr-ball 2.6s ease-out infinite}
  .drive #legL{transform:rotate(8deg)} .drive #legR{transform:rotate(-8deg)}
  @keyframes dr-body{0%,32%{transform:rotate(3deg)}48%{transform:rotate(14deg)}56%{transform:rotate(-4deg)}66%,100%{transform:rotate(-12deg)}}
  @keyframes dr-head{0%,32%{transform:rotate(8deg)}48%{transform:rotate(14deg)}56%{transform:rotate(0)}66%,100%{transform:rotate(-22deg)}}
  @keyframes dr-armL{0%,32%{transform:rotate(-22deg)}48%{transform:rotate(-135deg)}56%{transform:rotate(-10deg)}66%,100%{transform:rotate(95deg)}}
  @keyframes dr-armR{0%,32%{transform:rotate(22deg)}48%{transform:rotate(-95deg)}56%{transform:rotate(20deg)}66%,100%{transform:rotate(150deg)}}
  @keyframes dr-club{0%,20%{transform:rotate(0)}26%{transform:rotate(-8deg)}32%{transform:rotate(0)}48%{transform:rotate(-200deg)}56%{transform:rotate(-10deg)}66%,100%{transform:rotate(150deg)}}
  @keyframes dr-ball{
    0%,55%{transform:translate(0,0);opacity:1}
    70%{transform:translate(170px,-210px) rotate(180deg);opacity:1}
    92%{transform:translate(420px,-120px) rotate(520deg);opacity:1}
    93%,100%{transform:translate(420px,-120px);opacity:0}
  }

  /* Putt: read it, tap it, in the hole */
  .putt #body{animation:pt-body 3s ease-in-out infinite}
  .putt #head{animation:pt-head 3s ease-in-out infinite}
  .putt #armL{animation:pt-armL 3s ease-in-out infinite}
  .putt #armR{animation:pt-armR 3s ease-in-out infinite}
  .putt #club{animation:pt-club 3s ease-in-out infinite}
  .putt #gball{animation:pt-ball 3s ease-in-out infinite}
  .putt #flag{animation:pt-flag 3s ease-in-out infinite}
  @keyframes pt-body{0%,100%{transform:rotate(4deg)}60%{transform:rotate(2deg)}}
  @keyframes pt-head{0%,30%{transform:rotate(12deg)}50%{transform:rotate(8deg)}70%,100%{transform:rotate(-14deg)}}
  @keyframes pt-armL{0%,30%{transform:rotate(-22deg)}38%{transform:rotate(-34deg)}46%{transform:rotate(-8deg)}60%,100%{transform:rotate(-22deg)}}
  @keyframes pt-armR{0%,30%{transform:rotate(22deg)}38%{transform:rotate(10deg)}46%{transform:rotate(36deg)}60%,100%{transform:rotate(22deg)}}
  @keyframes pt-club{0%,30%{transform:rotate(0)}38%{transform:rotate(-28deg)}46%{transform:rotate(24deg)}60%,100%{transform:rotate(0)}}
  @keyframes pt-ball{
    0%,44%{transform:translateX(0) rotate(0);opacity:1}
    72%{transform:translateX(74px) rotate(540deg);opacity:1}
    80%{transform:translate(78px,14px) rotate(600deg);opacity:0}
    100%{transform:translate(78px,14px);opacity:0}
  }
  @keyframes pt-flag{0%,70%{transform:rotate(0)}76%{transform:rotate(-6deg)}82%{transform:rotate(5deg)}90%,100%{transform:rotate(0)}}

  /* Birdie: club in the air, fist pump, hop */
  .birdie #body{animation:bd-body .55s ease-in-out infinite}
  .birdie #head{animation:bd-head 1.1s ease-in-out infinite}
  .birdie #armL{animation:bd-armL .55s ease-in-out infinite}
  .birdie #armR{animation:bd-armR .55s ease-in-out infinite}
  .birdie #legL{animation:bd-legL .55s ease-in-out infinite}
  .birdie #legR{animation:bd-legR .55s ease-in-out infinite}
  .birdie #gball{transform:translate(78px,14px);opacity:0}
  @keyframes bd-body{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
  @keyframes bd-head{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
  @keyframes bd-armL{0%,100%{transform:rotate(145deg)}50%{transform:rotate(165deg)}}
  @keyframes bd-armR{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-175deg)}}
  @keyframes bd-legL{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
  @keyframes bd-legR{0%,100%{transform:rotate(0)}50%{transform:rotate(26deg)}}
  .birdie #club{opacity:0} /* club's already been tossed in the air */

  /* confetti */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
  .confetti i{
    position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

  @media (prefers-reduced-motion:reduce){
    .buddy [id]{animation-duration:3s !important}
    .confetti{display:none}
  }
</style>
</head>
<body>

<header>
  <h1 id="title">Hey Stephen.</h1>
  <p id="sub">I just wanted you to know....</p>
  <span class="pennant">FALL EDITION · TEE TIME</span>
</header>

<section class="stage" id="stage">
  <div class="floor"></div>
  <div class="bubble" id="bubble">Loading a good one…</div>
  <div class="buddy-wrap">
    <div class="buddy" aria-hidden="true">
      <svg viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
        <g id="body" class="part" style="transform-origin:100px 150px">
          <!-- legs (behind torso) -->
          <g id="legL" class="part" style="transform-origin:87px 150px">
            <rect x="79" y="148" width="16" height="78" rx="8" fill="var(--blue)"/>
            <rect x="74" y="218" width="28" height="14" rx="7" fill="var(--ink)"/>
          </g>
          <g id="legR" class="part" style="transform-origin:113px 150px">
            <rect x="105" y="148" width="16" height="78" rx="8" fill="var(--blue)"/>
            <rect x="98" y="218" width="28" height="14" rx="7" fill="var(--ink)"/>
          </g>
          <!-- torso: red shirt with a little One Degree stripe -->
          <rect x="72" y="80" width="56" height="76" rx="14" fill="var(--red)"/>
          <rect x="72" y="118" width="56" height="8" fill="#fff" opacity=".9"/>
          <!-- arms (drawn over the torso so they never hide behind it) -->
          <g id="armL" class="part" style="transform-origin:70px 92px">
            <rect x="62" y="84" width="16" height="72" rx="8" fill="var(--red)"/>
            <circle cx="70" cy="156" r="9" fill="var(--sun)"/>
          </g>
          <g id="armR" class="part" style="transform-origin:130px 92px">
            <rect x="122" y="84" width="16" height="72" rx="8" fill="var(--red)"/>
            <circle cx="130" cy="156" r="9" fill="var(--sun)"/>
          </g>
          <!-- head -->
          <g id="head" class="part" style="transform-origin:100px 80px">
            <rect x="93" y="70" width="14" height="14" fill="var(--sun)"/>
            <circle cx="100" cy="48" r="30" fill="var(--sun)"/>
            <!-- hair -->
            <path d="M70 44 Q80 14 100 18 Q120 14 130 44 Q118 32 100 30 Q82 32 70 44Z" fill="#E8B84A"/>
            <!-- eyes -->
            <circle cx="89" cy="48" r="3.5" fill="var(--ink)"/>
            <circle cx="111" cy="48" r="3.5" fill="var(--ink)"/>
            <!-- glasses -->
            <g fill="none" stroke="var(--ink)" stroke-width="2.5">
              <circle cx="89" cy="48" r="8"/>
              <circle cx="111" cy="48" r="8"/>
              <path d="M97 48 L103 48 M81 46 L72 43 M119 46 L128 43"/>
            </g>
            <!-- grin -->
            <path d="M86 58 Q100 72 114 58" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <!-- cheeks -->
            <circle cx="82" cy="58" r="4" fill="var(--red)" opacity=".35"/>
            <circle cx="118" cy="58" r="4" fill="var(--red)" opacity=".35"/>
          </g>
        </g>
        <!-- golf club: pivots at the hands -->
        <g id="club" class="part" style="transform-origin:100px 152px">
          <line x1="100" y1="152" x2="142" y2="226" stroke="#7A7F87" stroke-width="4" stroke-linecap="round"/>
          <path d="M136 220 L152 224 Q160 228 154 234 L140 232 Z" fill="var(--ink)"/>
        </g>
        <!-- golf ball on its tee -->
        <g id="gball" class="part" style="transform-origin:152px 226px">
          <circle cx="152" cy="226" r="6" fill="#fff" stroke="#C9CDD3" stroke-width="1.2"/>
          <circle cx="150" cy="224" r="1" fill="#C9CDD3"/><circle cx="154" cy="227" r="1" fill="#C9CDD3"/><circle cx="151" cy="229" r="1" fill="#C9CDD3"/>
        </g>
        <!-- the hole and the flag -->
        <g id="hole">
          <ellipse cx="230" cy="236" rx="11" ry="4" fill="#163D18"/>
          <g id="flag" class="part" style="transform-origin:230px 236px">
            <line x1="230" y1="236" x2="230" y2="150" stroke="#fff" stroke-width="3"/>
            <path d="M231 152 L266 162 L231 172 Z" fill="var(--red)"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</section>

<div class="controls">
  <button id="btnMove">Do another move</button>
  <button id="btnParty" class="alt">Confetti, please</button>
</div>

<div class="leaves" id="leaves"></div>
<div class="confetti" id="confetti"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   EDIT ZONE — everything you'd want to change lives here.
   Push a new index.html to GitHub and Vercel redeploys it.
   ═══════════════════════════════════════════════════════════════ */

// Who this page is for. Change the name and the page follows.
const NAME = "Stephen";

// One message shows at random each time the page loads.
// Keep one line here for a single fixed message, or several to rotate by visit.
const MESSAGES = [
  "Summer is over. We did it. Take a breath, take a bow... and now let's get ready to do it again!",
];

// Moves cycle on load and on "Do another move."
// Options: "drive", "putt", "birdie"
const MOVES = ["drive", "putt", "birdie"];

// Optional: a message for a specific date (YYYY-MM-DD). Shows instead of the
// random rotation on that day. Handy for birthdays or "you closed the deal."
const DATED = {
  // "2026-09-16": "Yesterday was yesterday. New day, new jacks.",
};

/* ═══════════════════════════════════════════════════════════════ */

const stage = document.getElementById("stage");
const bubble = document.getElementById("bubble");
document.getElementById("title").textContent = "Hey " + NAME + ".";

const url = new URLSearchParams(location.search);
let moveIdx = Math.floor(Math.random() * MOVES.length);
let msgIdx  = Math.floor(Math.random() * MESSAGES.length);

function setMove(name){
  stage.classList.remove(...MOVES);
  // restart animations cleanly
  void stage.offsetWidth;
  stage.classList.add(name);
}
function setMessage(text){
  bubble.style.animation = "none";
  void bubble.offsetWidth;
  bubble.style.animation = "";
  bubble.textContent = text;
}
function nextMove(){ moveIdx = (moveIdx + 1) % MOVES.length; setMove(MOVES[moveIdx]); }

function confetti(n = 90){
  const box = document.getElementById("confetti");
  const colors = ["#E4572E","#F3A712","#2E7D32","#FFFFFF","#FFD166","#003F87"];
  for (let i = 0; i < n; i++){
    const c = document.createElement("i");
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2 + Math.random()*2) + "s";
    c.style.animationDelay = Math.random()*0.6 + "s";
    c.style.transform = "rotate(" + Math.random()*360 + "deg)";
    box.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// Initial state: URL params win (?move=wave&msg=Hello%20Stephen), then dated, then random
const today = new Date().toISOString().slice(0,10);
if (url.get("move") && MOVES.includes(url.get("move"))) moveIdx = MOVES.indexOf(url.get("move"));
setMove(MOVES[moveIdx]);
if (url.get("msg")) setMessage(url.get("msg"));
else if (DATED[today]) setMessage(DATED[today]);
else setMessage(MESSAGES[msgIdx]);


// Drifting fall leaves — set LEAF_COUNT to 0 to turn them off
const LEAF_COUNT = 14;
(function leaves(){
  const box = document.getElementById("leaves");
  const cols = ["var(--leaf1)","var(--leaf2)","var(--leaf3)"];
  for (let i = 0; i < LEAF_COUNT; i++){
    const l = document.createElementNS("http://www.w3.org/2000/svg","svg");
    l.setAttribute("viewBox","0 0 24 24");
    l.innerHTML = '<path d="M12 2 C4 6 2 14 3 21 C10 20 18 16 21 4 Z" fill="'+cols[i%3]+'"/><path d="M4 20 L18 6" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/>';
    l.style.left = Math.random()*100 + "vw";
    l.style.animationDuration = (9 + Math.random()*9) + "s";
    l.style.animationDelay = (-Math.random()*18) + "s";
    box.appendChild(l);
  }
})();

document.getElementById("btnMove").addEventListener("click", nextMove);
document.getElementById("btnParty").addEventListener("click", () => confetti());
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); nextMove(); }
});
</script>
</body>
</html>
